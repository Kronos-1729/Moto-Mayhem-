name: Apply Moto Mayhem track UI redesign
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch existing index.html in place
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          marker='</body>'
          if marker not in s: raise SystemExit('No body marker found')
          if 'MM_TRACK_SHOWCASE_V1' in s: raise SystemExit('Already patched')
          css='''<style id="MM_TRACK_SHOWCASE_V1">
#ov-tracks.mm-track-redesign{align-items:stretch;justify-content:flex-start;padding:14px 18px 18px;background:radial-gradient(circle at 76% 16%,rgba(255,94,58,.13),transparent 34%),linear-gradient(160deg,rgba(22,24,31,.98),rgba(7,8,12,.99))}
.mm-track-redesign .btn-back{position:absolute;left:14px;top:10px;margin:0;z-index:8}.mm-track-redesign>h1,.mm-track-redesign>#track-desc{display:none}
.mm-track-shell{width:100%;max-width:850px;height:100%;margin:auto;display:grid;grid-template-columns:minmax(225px,.8fr) minmax(320px,1.45fr);gap:14px;padding-top:22px;min-height:0}
.mm-track-list-wrap{display:flex;flex-direction:column;min-height:0;overflow:auto;padding:0 3px 4px}.mm-track-kicker{font:700 10px Rajdhani,Inter,sans-serif;letter-spacing:3px;color:#707887;text-transform:uppercase;margin:3px 0 7px 3px}
.mm-track-redesign #track-list{width:100%!important;align-items:stretch!important}.mm-track-redesign #track-list .tcard{max-width:none;width:100%;margin:4px 0;padding:10px 11px;border-radius:9px;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;position:relative;overflow:hidden}.mm-track-redesign #track-list .tcard:hover{transform:translateX(3px);background:rgba(255,255,255,.055)}.mm-track-redesign #track-list .tcard.active{border-color:#ff5e3a;background:linear-gradient(90deg,rgba(255,94,58,.17),rgba(255,94,58,.045));box-shadow:inset 3px 0 #ff5e3a,0 10px 25px rgba(0,0,0,.2)}
.mm-track-hero{position:relative;min-height:0;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.11);background:#11151c;box-shadow:0 22px 50px rgba(0,0,0,.38);display:flex;flex-direction:column;justify-content:flex-end;padding:21px}.mm-track-hero:before{content:"";position:absolute;inset:0;background:var(--mm-scene,linear-gradient(135deg,#151b26,#39434f));opacity:.95}.mm-track-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(4,6,9,.96),rgba(4,6,9,.25) 62%,transparent)}.mm-track-art{position:absolute;inset:0;display:grid;place-items:center;font-size:92px;z-index:1;filter:drop-shadow(0 18px 22px rgba(0,0,0,.5))}.mm-track-art small{position:absolute;right:16px;top:14px;font:700 9px Rajdhani,Inter,sans-serif;letter-spacing:2px;color:rgba(255,255,255,.58)}.mm-track-copy{position:relative;z-index:2;text-align:left}.mm-track-label{font:700 10px Rajdhani,Inter,sans-serif;letter-spacing:3px;color:#ff795f;text-transform:uppercase;margin-bottom:4px}.mm-track-title{font:400 clamp(27px,4vw,43px) 'Racing Sans One',Rajdhani,sans-serif;color:#fff;letter-spacing:2px;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.5)}.mm-track-rule{width:54px;height:5px;background:#ff5e3a;transform:skewX(-22deg);margin:10px 0}.mm-track-desc{color:#b8bec8;font-size:10px;line-height:1.6;max-width:520px}.mm-track-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:13px}.mm-track-metric{display:flex;flex-direction:column;gap:2px}.mm-track-metric b{font:700 16px Rajdhani,Inter,sans-serif;color:#fff;letter-spacing:1px}.mm-track-metric span{font-size:8px;color:#737c8a;text-transform:uppercase;letter-spacing:1.4px}.mm-track-actions{display:flex;gap:9px;margin-top:14px;align-items:center}.mm-track-race{border:0;border-radius:7px;padding:10px 20px;background:#ff5e3a;color:#fff;font:700 13px Rajdhani,Inter,sans-serif;letter-spacing:2px;cursor:pointer;box-shadow:0 10px 24px rgba(255,94,58,.22)}.mm-track-race:active{transform:scale(.97)}.mm-track-locked{padding:9px 12px;border:1px solid rgba(255,255,255,.12);border-radius:7px;background:rgba(255,255,255,.045);color:#89919f;font:600 9px Rajdhani,Inter,sans-serif;letter-spacing:1.1px}@media(max-width:700px){.mm-track-shell{grid-template-columns:1fr;grid-template-rows:minmax(250px,1fr) auto;overflow:auto;padding-top:22px;gap:10px}.mm-track-hero{min-height:270px;order:1}.mm-track-list-wrap{order:2;max-height:245px}.mm-track-title{font-size:30px}}
</style>'''
          js='''<script id="MM_TRACK_SHOWCASE_JS">(function(){const ov=document.getElementById('ov-tracks'),list=document.getElementById('track-list');if(!ov||!list)return;ov.classList.add('mm-track-redesign');let shell=document.getElementById('mm-track-shell');if(!shell){shell=document.createElement('div');shell.id='mm-track-shell';shell.className='mm-track-shell';const wrap=document.createElement('div');wrap.className='mm-track-list-wrap';const kicker=document.createElement('div');kicker.className='mm-track-kicker';kicker.textContent='SELECT YOUR ROUTE';wrap.append(kicker,list);const hero=document.createElement('section');hero.id='mm-track-hero';hero.className='mm-track-hero';shell.append(wrap,hero);ov.append(shell)}function scene(i){return({'🌃':['NIGHT RUN','STREET SERIES','linear-gradient(135deg,#09142b,#17476c 48%,#ff6a3d)'],'🏖️':['COASTLINE','STREET SERIES','linear-gradient(135deg,#12475d,#e69b58 58%,#f3d39b)'],'🏔️':['HIGH COUNTRY','STREET SERIES','linear-gradient(135deg,#152b40,#7596af 55%,#e9eef2)'],'🏜️':['OUTLAW TERRITORY','OUTLAW CIRCUIT','linear-gradient(135deg,#612313,#c27b42 52%,#efd095)'],'🌆':['RUSH HOUR','OUTLAW CIRCUIT','linear-gradient(135deg,#26323d,#a9a69d 54%,#d6ae67)'],'⚓':['DOCKLANDS','OUTLAW CIRCUIT','linear-gradient(135deg,#0a1119,#3a4b58 50%,#d09a50)'],'🌋':['VOLCANIC RIDGE','ELITE GAUNTLET','linear-gradient(135deg,#210806,#711b0b 50%,#ff681e)'],'❄️':['WHITEOUT','ELITE GAUNTLET','linear-gradient(135deg,#243644,#8ca7ba 50%,#edf5fa)'],'☠️':['FINAL GAUNTLET','ELITE GAUNTLET','linear-gradient(135deg,#180b27,#41205c 50%,#ff5e3a)']})[i]||['RACE','MOTO MAYHEM','linear-gradient(135deg,#161b24,#3d4651)']}function update(){const cards=[...list.querySelectorAll('.tcard')],active=list.querySelector('.tcard.active')||cards.find(c=>!c.classList.contains('locked'))||cards[0];if(!active)return;const icon=active.querySelector('.ti')?.textContent.trim()||'🏁',title=active.querySelector('.tn')?.textContent.trim()||'TRACK',meta=active.querySelector('.tm')?.textContent.trim()||'',best=active.querySelector('.tb2')?.textContent.trim()||'NO RECORD',locked=active.classList.contains('locked'),sc=scene(icon),hero=document.getElementById('mm-track-hero');hero.style.setProperty('--mm-scene',sc[2]);const dist=(meta.match(/\\d+(?:\\.\\d+)?/)||['—'])[0],rivals=(meta.match(/\\d+\\s*rivals?/i)||['—'])[0];hero.innerHTML='<div class="mm-track-art"><span>'+icon+'</span><small>'+sc[0]+'</small></div><div class="mm-track-copy"><div class="mm-track-label">'+sc[1]+'</div><div class="mm-track-title">'+title+'</div><div class="mm-track-rule"></div><div class="mm-track-desc">'+(document.getElementById('track-desc')?.textContent.trim()||'A high-speed route built for aggressive lines, close battles and no room for mistakes.')+'</div><div class="mm-track-meta"><div class="mm-track-metric"><b>'+dist+' m</b><span>Distance</span></div><div class="mm-track-metric"><b>'+rivals+'</b><span>Field</span></div><div class="mm-track-metric"><b>'+best.replace('Best: ','')+'</b><span>Record</span></div></div><div class="mm-track-actions">'+(locked?'<div class="mm-track-locked">LOCKED — COMPLETE THE REQUIRED SERIES</div>':'<button class="mm-track-race" type="button">RACE NOW →</button>')+'</div></div>';hero.querySelector('.mm-track-race')?.addEventListener('click',()=>active.querySelector('.tplay')?.click())}new MutationObserver(update).observe(list,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});update()})();</script>'''
          s=s.replace(marker,css+js+marker,1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/mm-track-ui.yml
          git commit -m "Redesign track selection UI in game"
          git push
